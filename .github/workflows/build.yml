name: Build GALERY X APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract build.zip
        shell: bash
        run: |
          set -e
          if [ -f build.zip ]; then
            unzip -o build.zip -d extracted_project
            if [ -f extracted_project/settings.gradle ]; then
              echo "PROJECT_DIR=extracted_project" >> "$GITHUB_ENV"
            else
              echo "ERROR: settings.gradle tidak ditemukan di dalam build.zip"
              find extracted_project -maxdepth 4 -type f | head -80
              exit 1
            fi
          elif [ -f settings.gradle ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "ERROR: build.zip atau settings.gradle tidak ditemukan di root repository"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GALERY-X-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
