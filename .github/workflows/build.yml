name: Build GALERY X APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP if needed
        shell: bash
        run: |
          set -e
          if [ -f "build.zip" ]; then
            echo "Found build.zip, extracting project..."
            unzip -o build.zip -d .
          fi

          echo "Checking Gradle project files..."
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            FOUND="$(find . -mindepth 2 -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            if [ -n "$FOUND" ]; then
              PROJECT_DIR="$(dirname "$FOUND")"
              echo "Gradle project found in: $PROJECT_DIR"
              echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            else
              echo "ERROR: settings.gradle not found. Upload build.zip to repository root, or upload the extracted project files."
              exit 1
            fi
          else
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GALERY-X-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
